[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warpica"
dynamic = ["version"]
description = "Numerical spacetime metrics, stress-energy and energy-condition analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Francesco Cini" }]
keywords = ["general relativity", "warp drive", "energy conditions", "spacetime metrics", "numerical relativity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# Floors are the oldest versions the full test suite passes on (see the
# "minimum" CI job); matplotlib's floor is under the plot extra.
dependencies = [
    "array-api-compat>=1.5",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Francesco-Cini/warpica"
Documentation = "https://github.com/Francesco-Cini/warpica/tree/develop/docs"
Changelog = "https://github.com/Francesco-Cini/warpica/blob/develop/CHANGELOG.md"
Issues = "https://github.com/Francesco-Cini/warpica/issues"
Upstream = "https://github.com/NerdsWithAttitudes/WarpFactory"

[project.optional-dependencies]
# Experimental GPU backends: not covered by the 1.x stability promise.
cuda = ["cupy-cuda12x>=13"]
directml = ["torch-directml==0.2.5.dev240914"]
release = ["build>=1", "twine>=6"]
plot = ["matplotlib>=3.8"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = ["ruff>=0.11", "mypy>=1.11"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
# Package markers and small modules do not need redundant docstrings.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"tools/**" = ["D"]
# Keep the established mathematical keyword argument for compatibility.
"warpica/solver/utils/get_christoffel_sym.py" = ["E741"]
# Select the optional plotting dependency and backend before importing pyplot.
"tests/visualiser/*.py" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: complete multi-component workflows",
    "numerical: convergence and accuracy checks",
    "parity: comparisons against MATLAB reference data",
    "performance: advisory timing guard; opt in with --run-performance",
    "gpu: opt-in tests requiring a selected physical GPU backend",
    "slow: tests excluded from the default development suite",
]

[tool.mypy]
python_version = "3.11"
files = ["warpica"]
warn_unused_ignores = true
warn_redundant_casts = true
# Functions without annotations are not checked: the public API is annotated
# (tests/test_typing.py enforces that) and most internal helpers are not yet.

[[tool.mypy.overrides]]
# Untyped upstream, or optional device backends that are not always installed.
module = [
    "array_api_compat",
    "array_api_compat.*",
    "cupy",
    "cupy.*",
    "torch",
    "torch.*",
    "torch_directml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["warpica"]
# The backend adapters need a physical CUDA or DirectML device, so hosted CI
# cannot run them (see docs/gpu.md). Everything else is measured.
omit = ["warpica/gpu/utils/*"]

[tool.coverage.report]
fail_under = 98
exclude_also = [
    'if getattr\(getattr\(A, "device", None\), "type", None\) == "privateuseone":',
    'if library == "cupy":',
    'if library == "torch-directml":',
    'if is_cupy_array\(value\):',
    'if is_torch_array\(value\):',
]

[tool.setuptools.package-data]
warpica = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "warpica.__version__"}

[tool.setuptools.packages.find]
include = ["warpica*"]
