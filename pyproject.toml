[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warplab"
dynamic = ["version"]
description = "Numerical spacetime metrics, stress-energy and energy-condition analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Floors are the oldest versions the full test suite passes on (see the
# "minimum" CI job); matplotlib's floor is under the plot extra.
dependencies = [
    "array-api-compat>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Experimental GPU backends: not covered by the 1.x stability promise.
cuda = ["cupy-cuda12x>=13"]
directml = ["torch-directml==0.2.5.dev240914"]
release = ["build>=1", "twine>=6"]
plot = ["matplotlib>=3.8"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
# Package markers and small modules do not need redundant docstrings.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"tools/**" = ["D"]
"count_lines.py" = ["D"]
# Keep the established mathematical keyword argument for compatibility.
"warplab/solver/utils/get_christoffel_sym.py" = ["E741"]
# Select the optional plotting dependency and backend before importing pyplot.
"tests/visualiser/*.py" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: complete multi-component workflows",
    "numerical: convergence and accuracy checks",
    "parity: comparisons against MATLAB reference data",
    "performance: advisory timing guard; opt in with --run-performance",
    "gpu: opt-in tests requiring a selected physical GPU backend",
    "slow: tests excluded from the default development suite",
]

[tool.coverage.run]
source = ["warplab"]
# The backend adapters need a physical CUDA or DirectML device, so hosted CI
# cannot run them (see docs/gpu.md). Everything else is measured.
omit = ["warplab/gpu/utils/*"]

[tool.coverage.report]
fail_under = 98
exclude_also = [
    'if getattr\(getattr\(A, "device", None\), "type", None\) == "privateuseone":',
    'if library == "cupy":',
    'if library == "torch-directml":',
    'if is_cupy_array\(value\):',
    'if is_torch_array\(value\):',
]

[tool.setuptools.dynamic]
version = {attr = "warplab.__version__"}

[tool.setuptools.packages.find]
include = ["warplab*"]
